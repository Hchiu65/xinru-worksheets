<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>有得3C 字義選詞</title>
<style>
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
body { font-family:"標楷體","DFKai-SB",serif; background:#fff9f0; min-height:100vh; color:#333; }
header { background:linear-gradient(135deg,#f39c12,#e67e22); padding:14px 16px 12px; display:flex; align-items:center; justify-content:space-between; color:#fff; }
.hdr-left { display:flex; align-items:center; gap:10px; }
.btn-home { font-size:22px; text-decoration:none; }
.hdr-title { font-size:18px; font-weight:bold; letter-spacing:2px; }
.hdr-right { display:flex; align-items:center; gap:10px; }
.star-pill { background:rgba(255,255,255,.18); border-radius:20px; padding:5px 12px; font-size:16px; font-weight:bold; }
.progress-text { font-size:13px; opacity:.8; }
.prog-bar-wrap { height:5px; background:rgba(255,255,255,.3); }
.prog-bar { height:5px; background:#fff; transition:width .4s ease; }
.main { padding:16px 14px 40px; max-width:480px; margin:0 auto; }
.q-card { background:#fff; border-radius:20px; padding:22px 18px 20px; box-shadow:0 4px 20px rgba(243,156,18,.18); margin-bottom:18px; text-align:center; }
.q-num { font-size:13px; color:#aaa; margin-bottom:8px; }
.q-label { font-size:15px; color:#e67e22; font-weight:bold; margin-bottom:14px; background:#fef5ec; border-radius:8px; padding:6px 12px; display:inline-block; }
.q-def { font-size:22px; font-weight:bold; line-height:1.7; letter-spacing:1px; color:#333; min-height:60px; display:flex; align-items:center; justify-content:center; }
.correct-reveal { display:none; margin-top:12px; background:#e8f5e9; border-radius:10px; padding:10px 14px; font-size:15px; color:#2e7d32; font-weight:bold; }
.correct-reveal.show { display:block; }
.opts-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px; }
.opt-btn {
  background:#fff; border:2px solid #fad589; border-radius:14px;
  padding:18px 8px; font-size:24px; font-family:inherit; cursor:pointer;
  color:#333; font-weight:bold; transition:background .12s,border-color .12s,transform .1s;
  text-align:center; letter-spacing:2px;
}
.opt-btn:active { transform:scale(.95); }
.opt-btn.correct { background:#e8f5e9; border-color:#4caf50; }
.opt-btn.wrong   { background:#fce4ec; border-color:#ef9a9a; animation:shake .35s; }
.opt-btn:disabled { cursor:default; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 60%{transform:translateX(6px)} }
#feedback { display:none; position:fixed; inset:0; align-items:center; justify-content:center; background:rgba(0,0,0,.45); z-index:500; flex-direction:column; }
#feedback.show { display:flex; }
.fb-box { background:#fff; border-radius:22px; padding:28px 24px 24px; width:90%; max-width:350px; text-align:center; box-shadow:0 8px 32px rgba(0,0,0,.25); }
.fb-icon { font-size:52px; margin-bottom:8px; line-height:1; }
.fb-title { font-size:21px; font-weight:bold; margin-bottom:6px; }
.fb-stars { font-size:20px; color:#f5a623; margin-bottom:8px; }
.fb-word { font-size:26px; font-weight:bold; letter-spacing:3px; color:#e67e22; margin-bottom:6px; }
.fb-detail { font-size:14px; color:#555; margin-bottom:18px; line-height:1.7; }
.fb-next { width:100%; padding:13px; background:linear-gradient(135deg,#f39c12,#e67e22); color:#fff; border:none; border-radius:12px; font-size:17px; font-family:inherit; cursor:pointer; font-weight:bold; }
.star-pop { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); font-size:28px; font-weight:bold; color:#f5a623; pointer-events:none; z-index:600; animation:popUp .7s ease-out forwards; }
@keyframes popUp { 0%{opacity:1;transform:translate(-50%,-50%) scale(.5)} 50%{opacity:1;transform:translate(-50%,-120%) scale(1.2)} 100%{opacity:0;transform:translate(-50%,-200%) scale(1)} }
#done-screen { display:none; position:fixed; inset:0; background:#fff9f0; align-items:center; justify-content:center; z-index:800; flex-direction:column; padding:24px; }
#done-screen.show { display:flex; }
.done-box { text-align:center; max-width:340px; width:100%; }
.done-icon { font-size:72px; margin-bottom:12px; }
.done-title { font-size:26px; font-weight:bold; margin-bottom:8px; color:#e67e22; }
.done-score { font-size:18px; color:#666; margin-bottom:8px; }
.done-stars { font-size:32px; color:#f5a623; font-weight:bold; margin-bottom:24px; }
.done-btn { display:block; width:100%; padding:14px; background:linear-gradient(135deg,#f39c12,#e67e22); color:#fff; border:none; border-radius:14px; font-size:18px; font-family:inherit; cursor:pointer; font-weight:bold; margin-bottom:12px; text-decoration:none; text-align:center; }
.done-btn.secondary { background:#fff3e0; color:#e67e22; }

/* ── Error report ── */
.btn-report{background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);border-radius:16px;padding:6px 14px;font-size:16px;color:rgba(255,255,255,.8);cursor:pointer;font-family:inherit;flex-shrink:0;}
.btn-report:active{background:rgba(255,255,255,.28);}
#report-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:950;align-items:center;justify-content:center;}
#report-overlay.show{display:flex;}
.report-box{background:#fff;border-radius:22px;padding:28px 22px 22px;width:88%;max-width:380px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25);}
.report-title{font-size:18px;font-weight:bold;color:#e74c3c;margin-bottom:6px;}
.report-sub{font-size:13px;color:#aaa;margin-bottom:12px;}
.report-q{font-size:14px;color:#555;background:#f8f8f8;border-radius:10px;padding:10px 12px;margin-bottom:14px;line-height:1.7;text-align:left;word-break:break-all;}
.report-note{width:100%;padding:10px;font-size:14px;font-family:inherit;border:1.5px solid #eee;border-radius:10px;margin-bottom:14px;resize:none;height:60px;outline:none;box-sizing:border-box;}
.report-note:focus{border-color:#e74c3c;}
.report-btns{display:flex;gap:10px;}
.report-btn-cancel{flex:1;padding:12px;background:#f2f2f2;border:none;border-radius:12px;font-size:15px;font-family:inherit;cursor:pointer;color:#666;}
.report-btn-send{flex:1;padding:12px;background:#e74c3c;color:#fff;border:none;border-radius:12px;font-size:15px;font-family:inherit;cursor:pointer;font-weight:bold;}

/* ── 13吋 iPad（≥1000px） ── */
@media (min-width: 1000px) {
  header         { padding:18px 28px 16px; }
  .btn-home      { font-size:30px; }
  .hdr-title     { font-size:26px; letter-spacing:4px; }
  .star-pill     { font-size:22px; padding:8px 18px; }
  .progress-text { font-size:18px; }
  .prog-bar-wrap { height:7px; }
  .prog-bar      { height:7px; }
  .main          { max-width:720px; padding:22px 20px 60px; }
  .q-card        { padding:32px 28px 28px; margin-bottom:24px; border-radius:26px; }
  .q-num         { font-size:18px; margin-bottom:10px; }
  .q-label       { font-size:20px; padding:8px 16px; }
  .q-def         { font-size:32px; min-height:80px; }
  .correct-reveal{ font-size:22px; padding:14px 18px; }
  .opts-grid     { gap:16px; margin-bottom:28px; }
  .opt-btn       { font-size:34px; padding:28px 10px; border-radius:18px; border-width:3px; }
  .fb-box        { max-width:560px; padding:40px 36px 34px; border-radius:28px; }
  .fb-icon       { font-size:76px; }
  .fb-title      { font-size:30px; }
  .fb-stars      { font-size:30px; }
  .fb-word       { font-size:38px; }
  .fb-detail     { font-size:22px; }
  .fb-next       { font-size:24px; padding:17px; border-radius:16px; }
  .done-box      { max-width:560px; }
  .done-icon     { font-size:100px; }
  .done-title    { font-size:38px; }
  .done-score    { font-size:26px; }
  .done-stars    { font-size:48px; margin-bottom:32px; }
  .done-btn      { font-size:26px; padding:18px; border-radius:18px; }
  .btn-report    { font-size:20px; padding:9px 22px; }
  .report-box    { max-width:520px; }
  .report-title  { font-size:24px; }
}
</style>
</head>
<body>
<header>
  <div class="hdr-left">
    <a class="btn-home" href="index.html">🏠</a>
    <div class="hdr-title">有得3C　字義選詞</div>
  </div>
  <div class="hdr-right">
    <div class="progress-text" id="prog-text">1 / 14</div>
    <div class="star-pill">⭐ <span id="star-display">0</span></div>
    <button class="btn-report" onclick="showReport()">⚠️ 回報</button>
  </div>
</header>
<div class="prog-bar-wrap"><div class="prog-bar" id="prog-bar" style="width:0%"></div></div>

<div class="main">
  <div class="q-card">
    <div class="q-num" id="q-num">第 1 題 / 共 14 題</div>
    <div class="q-label">📖 看定義，選出正確的詞語！</div>
    <div class="q-def" id="q-def"></div>
    <div class="correct-reveal" id="correct-reveal"></div>
  </div>
  <div class="opts-grid" id="opts-grid"></div>
</div>

<div id="feedback">
  <div class="fb-box">
    <div class="fb-icon" id="fb-icon"></div>
    <div class="fb-title" id="fb-title"></div>
    <div class="fb-stars" id="fb-stars"></div>
    <div class="fb-word" id="fb-word"></div>
    <div class="fb-detail" id="fb-detail"></div>
    <button class="fb-next" onclick="nextQ()">繼續 →</button>
  </div>
</div>

<div id="done-screen">
  <div class="done-box">
    <div class="done-icon">🎉</div>
    <div class="done-title">字義選詞完成！</div>
    <div class="done-score" id="done-score"></div>
    <div class="done-stars" id="done-stars"></div>
    <button class="done-btn" onclick="replay()">🔁 再玩一次</button>
    <a class="done-btn secondary" href="index.html">🏠 回主頁</a>
  </div>
</div>

<div id="lock-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:999;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:22px;padding:32px 24px 28px;width:88%;max-width:340px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.3)">
    <div style="font-size:56px;line-height:1">🔒</div>
    <div style="font-size:22px;font-weight:bold;margin:12px 0 6px;color:#e67e22">關卡暫時鎖定</div>
    <div style="font-size:15px;color:#555;line-height:1.9;margin-bottom:6px">連續兩次全對！<br>請再完成其他 <b id="lock-remain">2</b> 個關卡再回來。</div>
    <div style="font-size:13px;color:#999;margin-bottom:20px">可去玩：<span id="lock-others"></span></div>
    <a href="index.html" style="display:block;padding:13px;background:linear-gradient(135deg,#f39c12,#e67e22);color:#fff;border-radius:12px;font-size:17px;font-family:inherit;font-weight:bold;text-decoration:none">🏠 去選其他關卡</a>
  </div>
</div>

<script>
// ── 常數 ──
const GAME_ID     = 'y3c-vocab';
const GAME_SOURCE = '有得3C　字義選詞';
const FB_URL      = 'https://xinru-class-default-rtdb.firebaseio.com';
const GAME_LABELS = {
  u1ziyin:'字音辨正(一)',u1bianzi:'找錯別字(一)',u1match:'連連看(一)',u2ziyin:'字音辨正(二)',u2bianzi:'找錯別字(二)',u2match:'連連看(二)',
  u3ziyin:'字音辨正(三)',u3bianzi:'找錯別字(三)',u3match:'連連看(三)',u4ziyin:'字音辨正(四)',u4bianzi:'找錯別字(四)',u4match:'連連看(四)',unit6:'詞語填空', unit6m:'成語連連看',
  u7ziyin:'字音辨正', u7bianzi:'找錯別字',
  u7gaicuo:'改錯字(作業)', u7bopomo:'字音辨字(作業)',
  u7vocab:'字彙練習(作業)', u7chengyu:'成語填空',
  u7match:'連連看(七)',
  'y3c-match':'連連看(3C)', 'y3c-chengyu':'填空(3C)', 'y3c-vocab':'字義選詞(3C)'
};

// ── 冷卻系統 ──
function getCDs(){return JSON.parse(localStorage.getItem('xr_cooldowns')||'{}');}
function saveCDs(cd){localStorage.setItem('xr_cooldowns',JSON.stringify(cd));}
function isLocked(){const g=getCDs()[GAME_ID];return !!(g&&g.locked&&(g.unlockBy||[]).length<2);}
function reportComplete(perfect){
  const cds=getCDs();
  if(!cds[GAME_ID])cds[GAME_ID]={streak:0,locked:false,unlockBy:[]};
  const me=cds[GAME_ID];
  if(!me.locked){me.streak=perfect?(me.streak||0)+1:0;if(me.streak>=2){me.locked=true;me.unlockBy=[];}}
  Object.keys(cds).forEach(id=>{
    if(id===GAME_ID||!cds[id].locked)return;
    if(!(cds[id].unlockBy||[]).includes(GAME_ID)){
      cds[id].unlockBy=[...(cds[id].unlockBy||[]),GAME_ID];
      if(cds[id].unlockBy.length>=2){cds[id].locked=false;cds[id].streak=0;cds[id].unlockBy=[];}
    }
  });
  saveCDs(cds); pushToCloud();
}
async function pushToCloud(){
  const name=localStorage.getItem('xr_name'); if(!name)return;
  const d={stars:getStars(),records:JSON.parse(localStorage.getItem('xr_records')||'[]'),
    mistakes:JSON.parse(localStorage.getItem('xr_mistakes')||'{}'),cooldowns:getCDs(),updated:Date.now()};
  try{await fetch(`${FB_URL}/accounts/${encodeURIComponent(name)}.json`,
    {method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});}catch(e){}
}
function showLockOverlay(){
  const cds=getCDs(),me=cds[GAME_ID]||{},done=(me.unlockBy||[]).length;
  document.getElementById('lock-remain').textContent=2-done;
  document.getElementById('lock-others').textContent=Object.keys(GAME_LABELS).filter(k=>k!==GAME_ID).map(k=>GAME_LABELS[k]).join('、');
  document.getElementById('lock-overlay').style.display='flex';
}

// ── 題目資料 ──
// def: 顯示的定義；correct: 正確詞語；opts: 四個選項（含正確答案）
const VOCAB = [
  // 第十課 地球的眼淚
  { def:'液體轉化成氣體的現象',                           correct:'蒸發',   opts:['蒸發','凝結','沖刷','下降'] },
  { def:'科學上指氣體變成液體的現象',                     correct:'凝結',   opts:['凝結','蒸發','雜質','岩石'] },
  { def:'水流衝擊，使土石流失或脫落、損壞',               correct:'沖刷',   opts:['沖刷','蒸發','凝結','下降'] },
  { def:'構成地球外殼的主要物質，多為礦物集合體',         correct:'岩石',   opts:['岩石','雜質','河川','凝結'] },
  { def:'大小河流的通稱',                                 correct:'河川',   opts:['河川','岩石','蒸發','下降'] },
  { def:'不屬於該物質的其他成分',                         correct:'雜質',   opts:['雜質','岩石','凝結','沖刷'] },
  // 第九課 三峽老街樂藍染
  { def:'貫穿山脈或地下，供行人、車輛通行的通道',         correct:'隧道',   opts:['隧道','拱廊','騎樓','展示間'] },
  { def:'用柱子支撐，帶有圓弧形頂部的開放式通道',         correct:'拱廊',   opts:['拱廊','隧道','騎樓','燈籠'] },
  { def:'建築物一樓靠馬路的部分建成走廊，可遮風避雨',     correct:'騎樓',   opts:['騎樓','拱廊','隧道','展示間'] },
  { def:'以竹或鐵絲為骨架、外糊紙或紗，供裝飾或照明的籠狀燈具', correct:'燈籠', opts:['燈籠','拱廊','騎樓','隧道'] },
  { def:'臺灣於西元一八九五年至一九四五年，由日本統治的時期', correct:'日治時期', opts:['日治時期','展示間','三峽老街','隧道'] },
  { def:'擺出供人觀賞的場所',                             correct:'展示間', opts:['展示間','隧道','施展','騎樓'] },
  { def:'發揮、展露（才能或技藝）',                       correct:'施展',   opts:['施展','展示間','開獎','傻笑'] },
  { def:'揭曉中獎號碼或中獎人',                           correct:'開獎',   opts:['開獎','施展','展示間','傻笑'] },
];

// ── 狀態 ──
let order=[], idx=0, sessionStars=0, mistakeCount=0, totalCorrect=0, anyMistake=false;

function getStars(){return parseInt(localStorage.getItem('xr_stars')||'0');}
function addStars(n){const s=getStars()+n;localStorage.setItem('xr_stars',s);document.getElementById('star-display').textContent=s;sessionStars+=n;}

function recordMistake(word, def){
  const all=JSON.parse(localStorage.getItem('xr_mistakes')||'{}');
  if(!all[word])all[word]={word,question:def||word,meaning:def,source:GAME_SOURCE,wrongCount:0,practiceCount:0,lastWrong:'',mastered:false};
  if(!all[word].source)all[word].source=GAME_SOURCE;
  all[word].wrongCount++;all[word].lastWrong=new Date().toLocaleDateString('zh-TW');
  localStorage.setItem('xr_mistakes',JSON.stringify(all));
}

function speak(text){
  if(!window.speechSynthesis)return;
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-TW';u.rate=0.8;u.pitch=1.0;
  window.speechSynthesis.cancel();
  const go=()=>{
    const v=speechSynthesis.getVoices();
    const vv=v.find(x=>x.lang==='zh-TW')||v.find(x=>x.lang.startsWith('zh'));
    if(vv)u.voice=vv; speechSynthesis.speak(u);
  };
  speechSynthesis.getVoices().length?go():(speechSynthesis.onvoiceschanged=go);
}

function shuffle(arr){return [...arr].sort(()=>Math.random()-.5);}

function startGame(){
  if(isLocked()){showLockOverlay();return;}
  order=shuffle([...Array(VOCAB.length).keys()]);
  idx=0;sessionStars=0;totalCorrect=0;anyMistake=false;
  document.getElementById('star-display').textContent=getStars();
  document.getElementById('done-screen').classList.remove('show');
  showQ();
}

function showQ(){
  const item=VOCAB[order[idx]]; mistakeCount=0;
  document.getElementById('prog-text').textContent=`${idx+1} / ${VOCAB.length}`;
  document.getElementById('q-num').textContent=`第 ${idx+1} 題 / 共 ${VOCAB.length} 題`;
  document.getElementById('prog-bar').style.width=`${(idx/VOCAB.length)*100}%`;
  document.getElementById('correct-reveal').classList.remove('show');
  document.getElementById('q-def').textContent=item.def;
  const shuffledOpts=shuffle(item.opts);
  const grid=document.getElementById('opts-grid'); grid.innerHTML='';
  shuffledOpts.forEach(opt=>{
    const btn=document.createElement('button');
    btn.className='opt-btn'; btn.textContent=opt;
    btn.onclick=()=>onPick(btn,opt,item); grid.appendChild(btn);
  });
}

function onPick(btn,picked,item){
  const btns=document.querySelectorAll('.opt-btn'); btns.forEach(b=>b.disabled=true);
  if(picked===item.correct){
    btn.classList.add('correct');
    const earned=mistakeCount===0?5:1;
    if(mistakeCount===0)totalCorrect++;
    addStars(earned); showStarPop(`+${earned}⭐`);
    const cr=document.getElementById('correct-reveal');
    cr.textContent=`✅ 正確答案：${item.correct}`; cr.classList.add('show');
    speak(item.correct); showFeedback(true,earned,item);
  } else {
    btn.classList.add('wrong');
    mistakeCount++;
    if(mistakeCount===1){anyMistake=true;recordMistake(item.correct,item.def);}
    addStars(-1); showStarPop('-1⭐');
    setTimeout(()=>{btn.classList.remove('wrong');btn.disabled=false;btns.forEach(b=>{if(b!==btn)b.disabled=false;});},500);
  }
}

function showFeedback(correct,earned,item){
  document.getElementById('fb-icon').textContent=correct?'🎯':'💪';
  document.getElementById('fb-title').textContent=correct?'答對了！':'繼續加油！';
  document.getElementById('fb-stars').textContent=earned>0?`+${earned} ⭐`:'';
  document.getElementById('fb-word').textContent=item.correct;
  document.getElementById('fb-detail').textContent=item.def;
  document.getElementById('feedback').classList.add('show');
}

function nextQ(){
  document.getElementById('feedback').classList.remove('show'); idx++;
  if(idx>=VOCAB.length)showDone(); else showQ();
}

function showDone(){
  document.getElementById('prog-bar').style.width='100%';
  document.getElementById('done-score').textContent=`首次答對 ${totalCorrect} / ${VOCAB.length} 題`;
  document.getElementById('done-stars').textContent=`本次獲得 ⭐ ${sessionStars}`;
  const recs=JSON.parse(localStorage.getItem('xr_records')||'[]');
  recs.push({unit:GAME_ID,acc:Math.round(totalCorrect/VOCAB.length*100),stars:sessionStars,date:new Date().toLocaleDateString('zh-TW')});
  if(recs.length>200)recs.splice(0,recs.length-200);
  localStorage.setItem('xr_records',JSON.stringify(recs));
  reportComplete(totalCorrect===VOCAB.length&&!anyMistake);
  document.getElementById('done-screen').classList.add('show');
}

function showStarPop(text){const el=document.createElement('div');el.className='star-pop';el.textContent=text;document.body.appendChild(el);setTimeout(()=>el.remove(),800);}
function replay(){startGame();}
startGame();

function getQText(){return document.getElementById('q-def')?.textContent||GAME_SOURCE;}
function showReport(){document.getElementById('report-q').textContent=getQText();document.getElementById('report-note').value='';document.getElementById('report-overlay').classList.add('show');}
function closeReport(){document.getElementById('report-overlay').classList.remove('show');}
async function submitReport(){const data={game:GAME_ID,source:GAME_SOURCE,qText:document.getElementById('report-q').textContent,note:document.getElementById('report-note').value.trim(),player:localStorage.getItem('xr_name')||'匿名',date:new Date().toLocaleDateString('zh-TW'),ts:Date.now(),resolved:false};try{await fetch(`${FB_URL}/error_reports.json`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});}catch(e){}closeReport();const t=document.createElement('div');t.style.cssText='position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 22px;border-radius:20px;font-size:14px;z-index:999;pointer-events:none;';t.textContent='✓ 已通知老師，謝謝！';document.body.appendChild(t);setTimeout(()=>t.remove(),2500);}
</script>

<div id="report-overlay">
  <div class="report-box">
    <div class="report-title">⚠️ 回報題目錯誤</div>
    <div class="report-sub">這題有問題嗎？說明後老師會來確認</div>
    <div class="report-q" id="report-q"></div>
    <textarea class="report-note" id="report-note" placeholder="說明錯誤（可不填）"></textarea>
    <div class="report-btns">
      <button class="report-btn-cancel" onclick="closeReport()">取消</button>
      <button class="report-btn-send" onclick="submitReport()">確認回報</button>
    </div>
  </div>
</div>
</body>
</html>
