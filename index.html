<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>興儒六私國文班 互動練習卷</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "標楷體", "DFKai-SB", serif;
    background: #f4f6f9;
    margin: 0;
    padding: 0 0 60px;
    color: #222;
  }
  header {
    background: #2c5f8a;
    color: #fff;
    text-align: center;
    padding: 28px 16px 20px;
    font-size: 24px;
    letter-spacing: 4px;
  }
  header small {
    display: block;
    font-size: 14px;
    opacity: .75;
    margin-top: 6px;
    letter-spacing: 1px;
  }
  .container { max-width: 600px; margin: 0 auto; padding: 20px 16px; }
  h2 {
    font-size: 16px;
    color: #2c5f8a;
    border-left: 4px solid #2c5f8a;
    padding-left: 10px;
    margin: 28px 0 12px;
  }
  .card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    text-decoration: none;
    color: #222;
    transition: box-shadow .15s, transform .1s;
  }
  .card:active { transform: scale(.98); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .card-title { font-size: 18px; font-weight: bold; }
  .card-sub { font-size: 13px; color: #888; margin-top: 4px; }
  .arrow {
    font-size: 22px;
    color: #2c5f8a;
    flex-shrink: 0;
    margin-left: 12px;
  }
  .badge {
    display: inline-block;
    background: #e8f0f8;
    color: #2c5f8a;
    border-radius: 20px;
    font-size: 12px;
    padding: 2px 10px;
    margin-top: 4px;
  }
</style>
</head>
<body>
<header>
  興儒六私國文班
  <small>互動練習卷 · 點選單元開始作答</small>
</header>
<div class="container">
  <h2>第六冊</h2>

  <a class="card" href="unit6.html">
    <div>
      <div class="card-title">第六單元　詞語填空練習</div>
      <div class="card-sub">26 題填空，點選詞語填入空格</div>
      <span class="badge">互動填答</span>
    </div>
    <div class="arrow">▶</div>
  </a>

  <a class="card" href="unit6-match.html">
    <div>
      <div class="card-title">第六單元　成語語意連連看</div>
      <div class="card-sub">26 題配對，兩輪闖關</div>
      <span class="badge">遊戲</span>
    </div>
    <div class="arrow">▶</div>
  </a>

</div>
</body>
</html>
