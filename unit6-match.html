<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>第六單元 成語語意連連看</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "標楷體", "DFKai-SB", serif;
    background: #f4f6f9;
    margin: 0;
    padding: 0 0 80px;
    color: #222;
    font-size: 17px;
  }
  header {
    background: #2c5f8a;
    color: #fff;
    text-align: center;
    padding: 18px 16px 14px;
    font-size: 21px;
    letter-spacing: 3px;
  }
  header small {
    display: block;
    font-size: 13px;
    opacity: .75;
    margin-top: 4px;
    letter-spacing: 1px;
  }

  /* Progress bar */
  .progress-bar {
    background: #ddd;
    height: 6px;
  }
  .progress-fill {
    background: #4caf50;
    height: 6px;
    transition: width .4s ease;
  }

  /* Round label */
  .round-label {
    text-align: center;
    font-size: 14px;
    color: #2c5f8a;
    font-weight: bold;
    padding: 10px 0 4px;
    letter-spacing: 2px;
  }

  /* Match grid */
  .match-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 10px 10px 0;
  }
  .col-header {
    text-align: center;
    font-size: 13px;
    color: #888;
    padding: 4px 0 6px;
    letter-spacing: 2px;
    border-bottom: 2px solid #2c5f8a;
    margin-bottom: 4px;
  }

  /* Cards */
  .card {
    background: #fff;
    border: 2.5px solid #b0c8e0;
    border-radius: 10px;
    padding: 10px 10px;
    cursor: pointer;
    text-align: center;
    line-height: 1.5;
    font-size: 16px;
    transition: background .15s, border-color .15s, transform .1s;
    user-select: none;
    -webkit-user-select: none;
    min-height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card:active:not(.matched):not(.disabled) { transform: scale(.96); }
  .card.selected {
    background: #dceeff;
    border-color: #2c5f8a;
    box-shadow: 0 0 0 2px #2c5f8a;
  }
  .card.matched {
    background: #d4edda;
    border-color: #28a745;
    color: #155724;
    cursor: default;
    opacity: .8;
  }
  .card.wrong {
    background: #f8d7da;
    border-color: #dc3545;
    animation: shake .35s ease;
  }
  .card.disabled {
    opacity: .3;
    cursor: default;
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  /* Meaning card text is smaller */
  .meaning-card { font-size: 14px; }

  /* Completion screen */
  .complete-screen {
    display: none;
    margin: 20px 12px;
    background: #fff;
    border-radius: 14px;
    padding: 28px 20px;
    text-align: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.1);
  }
  .complete-screen .big-score {
    font-size: 52px;
    font-weight: bold;
    color: #2c5f8a;
    line-height: 1.1;
  }
  .complete-screen .label { font-size: 16px; color: #555; margin-top: 4px; }
  .complete-screen .btn-next {
    margin-top: 20px;
    background: #2c5f8a;
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 16px 40px;
    font-size: 18px;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 2px;
  }

  /* Bottom toolbar */
  .toolbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; gap: 10px; padding: 10px 14px;
    background: #fff; border-top: 1px solid #ddd;
    box-shadow: 0 -2px 8px rgba(0,0,0,.1);
    align-items: center;
  }
  .score-box {
    flex: 1;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    color: #2c5f8a;
  }
  .btn-reset {
    flex: 0 0 auto;
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    background: #eee;
    color: #555;
    font-size: 16px;
    font-family: inherit;
    cursor: pointer;
    font-weight: bold;
  }
</style>
</head>
<body>

<header>
  第六單元　成語連連看
  <small>點選左欄成語 → 再點右欄語意配對</small>
</header>
<div class="progress-bar"><div class="progress-fill" id="prog"></div></div>
<div class="round-label" id="round-label"></div>

<!-- Game area -->
<div id="game-area">
  <div class="match-grid">
    <div class="col-header">成　語</div>
    <div class="col-header">語　意</div>
    <div id="left-col"></div>
    <div id="right-col"></div>
  </div>
</div>

<!-- Complete screen (shown between rounds and at end) -->
<div class="complete-screen" id="complete-screen">
  <div class="big-score" id="complete-score"></div>
  <div class="label" id="complete-label"></div>
  <button class="btn-next" id="complete-btn" onclick="nextRound()"></button>
</div>

<div class="toolbar">
  <div class="score-box" id="score-box">0 / 0</div>
  <button class="btn-reset" onclick="restartRound()">↺ 重設</button>
</div>

<script>
const ROUNDS = [
  [
    { word: "獨樹一幟", meaning: "獨具特色，與眾不同" },
    { word: "暴戾之氣", meaning: "兇猛殘暴的神情或氣息" },
    { word: "雕欄玉砌", meaning: "建築雕飾精美華麗" },
    { word: "敷衍了事", meaning: "隨便應付，態度不認真" },
    { word: "選舉賄賂", meaning: "以財物換取選票的不法行為" },
    { word: "遭逢厄運", meaning: "碰上不幸的命運，遇到災難" },
    { word: "醍醐灌頂", meaning: "聽了高明的話，如獲啟示" },
    { word: "暴殄天物", meaning: "任意糟蹋，浪費珍貴物品" },
    { word: "慘遭蹂躪", meaning: "遭到強力踐踏、迫害" },
    { word: "濃妝豔抹", meaning: "化妝濃重，打扮妖豔" },
  ],
  [
    { word: "感慨萬千", meaning: "心中感觸極多，百感交集" },
    { word: "經濟蕭條", meaning: "經濟不景氣，百業衰退" },
    { word: "惺惺相惜", meaning: "才能相當的人互相敬重愛護" },
    { word: "絕不寬貸", meaning: "絕對不原諒，嚴厲處置" },
    { word: "集思廣益", meaning: "集合眾人智慧，廣泛獲益" },
    { word: "滄海一粟", meaning: "比喻極其微小，微不足道" },
    { word: "辭不達意", meaning: "說的話未能清楚表達心意" },
    { word: "暗箭難防", meaning: "暗中傷人的手段，難以防備" },
    { word: "肆無忌憚", meaning: "毫無顧忌，放肆妄為" },
    { word: "越俎代庖", meaning: "超越本分，代替別人做事" },
    { word: "敬請笑納", meaning: "請對方接受贈品的客套語" },
    { word: "脾氣暴躁", meaning: "性情急躁，容易動怒" },
    { word: "噤若寒蟬", meaning: "不敢作聲，沉默無言" },
    { word: "經驗老到", meaning: "經驗豐富，老練熟悉" },
    { word: "虛無縹緲", meaning: "空虛不實，模糊難以辨識" },
    { word: "騷擾鄰居", meaning: "打擾、侵擾鄰居的安寧" },
  ]
];

const TOTAL_PAIRS = ROUNDS.reduce((s, r) => s + r.length, 0);
let currentRound = 0;
let pairs = [];
let leftSelected = null;
let matchedCount = 0;
let totalMatched = 0;
let wrongCount = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildRound(roundIdx) {
  pairs = ROUNDS[roundIdx];
  matchedCount = 0;
  leftSelected = null;
  wrongCount = 0;

  const leftWords = shuffle(pairs.map((p, i) => ({ ...p, idx: i })));
  const rightWords = shuffle(pairs.map((p, i) => ({ ...p, idx: i })));

  const leftCol = document.getElementById('left-col');
  const rightCol = document.getElementById('right-col');
  leftCol.innerHTML = '';
  rightCol.innerHTML = '';

  leftWords.forEach(p => {
    const el = document.createElement('div');
    el.className = 'card';
    el.textContent = p.word;
    el.dataset.idx = p.idx;
    el.dataset.side = 'left';
    el.addEventListener('click', () => onLeftClick(el));
    leftCol.appendChild(el);
  });

  rightWords.forEach(p => {
    const el = document.createElement('div');
    el.className = 'card meaning-card';
    el.textContent = p.meaning;
    el.dataset.idx = p.idx;
    el.dataset.side = 'right';
    el.addEventListener('click', () => onRightClick(el));
    rightCol.appendChild(el);
  });

  document.getElementById('game-area').style.display = '';
  document.getElementById('complete-screen').style.display = 'none';
  document.getElementById('round-label').textContent =
    `── 第 ${roundIdx + 1} 輪 / 共 ${ROUNDS.length} 輪　(${pairs.length} 題) ──`;
  updateScore();
  updateProgress();
}

function onLeftClick(el) {
  if (el.classList.contains('matched') || el.classList.contains('disabled')) return;
  // Deselect previous
  if (leftSelected) leftSelected.classList.remove('selected');
  if (leftSelected === el) { leftSelected = null; return; }
  leftSelected = el;
  el.classList.add('selected');
}

function onRightClick(el) {
  if (el.classList.contains('matched') || el.classList.contains('disabled')) return;
  if (!leftSelected) return;

  const leftIdx = parseInt(leftSelected.dataset.idx);
  const rightIdx = parseInt(el.dataset.idx);

  if (leftIdx === rightIdx) {
    // Correct
    leftSelected.classList.remove('selected');
    leftSelected.classList.add('matched');
    el.classList.add('matched');
    leftSelected = null;
    matchedCount++;
    totalMatched++;
    updateScore();
    updateProgress();

    if (matchedCount === pairs.length) {
      setTimeout(showRoundComplete, 500);
    }
  } else {
    // Wrong
    const wrongLeft = leftSelected;
    wrongLeft.classList.add('wrong');
    el.classList.add('wrong');
    leftSelected.classList.remove('selected');
    leftSelected = null;
    wrongCount++;
    setTimeout(() => {
      wrongLeft.classList.remove('wrong');
      el.classList.remove('wrong');
    }, 500);
  }
}

function updateScore() {
  document.getElementById('score-box').textContent =
    `${matchedCount} / ${pairs.length}`;
}

function updateProgress() {
  const pct = Math.round((totalMatched / TOTAL_PAIRS) * 100);
  document.getElementById('prog').style.width = pct + '%';
}

function showRoundComplete() {
  document.getElementById('game-area').style.display = 'none';
  const screen = document.getElementById('complete-screen');
  const isLast = currentRound === ROUNDS.length - 1;

  document.getElementById('complete-score').textContent =
    `${pairs.length - wrongCount} / ${pairs.length}`;
  document.getElementById('complete-label').textContent =
    isLast ? '全部完成！答對率統計如下' : `第 ${currentRound + 1} 輪完成！`;
  document.getElementById('complete-btn').textContent =
    isLast ? '🎉 再玩一次' : `進入第 ${currentRound + 2} 輪 →`;
  screen.style.display = '';
}

function nextRound() {
  const isLast = currentRound === ROUNDS.length - 1;
  if (isLast) {
    currentRound = 0;
    totalMatched = 0;
    buildRound(0);
  } else {
    currentRound++;
    buildRound(currentRound);
  }
}

function restartRound() {
  totalMatched -= matchedCount;
  buildRound(currentRound);
}

// Start
buildRound(0);
</script>
</body>
</html>
